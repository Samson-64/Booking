services:
  db:
    image: postgres:16-alpine
    container_name: booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5433:5432"
    volumes:
      - booking_pgdata:/var/lib/postgresql/data

volumes:
  booking_pgdata:
